name: backend

services:
  mysql:
    image: mysql:8.4
    container_name: dev-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ltl10121314}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test}
      MYSQL_USER: ${MYSQL_USER:-dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - ${BACKEND_DATA_ROOT:-${HOME}/docker/backend}/mysql/data:/var/lib/mysql
    networks:
      - backend
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - ${BACKEND_DATA_ROOT:-${HOME}/docker/backend}/redis/data:/data
    networks:
      - backend
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-init:
    image: mysql:8.4
    container_name: dev-mysql-init
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-ltl10121314}
      APP_DB_NAME: order_payment
      APP_DB_USER: ${MYSQL_USER:-dev}
    entrypoint:
      - sh
      - -c
      - mysql --host=mysql --user=root --execute="CREATE DATABASE IF NOT EXISTS $${APP_DB_NAME} CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL PRIVILEGES ON $${APP_DB_NAME}.* TO '$${APP_DB_USER}'@'%'; FLUSH PRIVILEGES;"
    networks:
      - backend

  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: dev-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: SiUphDfqgGOohGd7YSMJVnLQk+8dKcUEKNEKO8Qa6Kw=
      NACOS_AUTH_IDENTITY_KEY: nacosAuthIdentityKey
      NACOS_AUTH_IDENTITY_VALUE: nacosAuthIdentityValue
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "8849:8080"
    volumes:
      - ${BACKEND_DATA_ROOT:-${HOME}/docker/backend}/nacos/data:/home/nacos/data
      - ${BACKEND_DATA_ROOT:-${HOME}/docker/backend}/nacos/logs:/home/nacos/logs
    networks:
      - backend
    mem_limit: 1g

  kafka:
    image: apache/kafka:4.1.2
    container_name: dev-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - ${BACKEND_DATA_ROOT:-${HOME}/docker/backend}/kafka/data:/var/lib/kafka/data
    networks:
      - backend
    mem_limit: 1g

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: dev-rmq-namesrv
    hostname: rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    volumes:
      - ${BACKEND_DATA_ROOT:-${HOME}/docker/backend}/rocketmq/data/namesrv:/home/rocketmq/logs
    networks:
      - backend
    mem_limit: 512m

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: dev-rmq-broker
    hostname: rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms256m -Xmx512m -Xmn128m
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    command: sh mqbroker -n rocketmq-namesrv:9876
    volumes:
      - ${BACKEND_DATA_ROOT:-${HOME}/docker/backend}/rocketmq/data/broker:/home/rocketmq/store
      - ${BACKEND_DATA_ROOT:-${HOME}/docker/backend}/rocketmq/data/broker-logs:/home/rocketmq/logs
    networks:
      - backend
    mem_limit: 1g

  rocketmq-proxy:
    image: apache/rocketmq:5.3.2
    container_name: dev-rmq-proxy
    hostname: rocketmq-proxy
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms256m -Xmx512m
    command: sh mqproxy
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - backend
    mem_limit: 1g

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: dev-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ${BACKEND_DATA_ROOT:-${HOME}/docker/backend}/elasticsearch/data:/usr/share/elasticsearch/data
    networks:
      - backend
    mem_limit: 1g

networks:
  backend:
    name: backend
    driver: bridge
