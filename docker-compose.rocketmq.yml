services:
  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    networks:
      - rocketmq

  broker:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-broker
    environment:
      NAMESRV_ADDR: namesrv:9876
    depends_on:
      - namesrv
    command: sh mqbroker -c /home/rocketmq/broker.conf
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    networks:
      - rocketmq

  proxy:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-proxy
    environment:
      NAMESRV_ADDR: namesrv:9876
    depends_on:
      - broker
      - namesrv
    command: sh mqproxy
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - rocketmq

  init:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-init
    depends_on:
      - broker
    command: >
      sh -lc "sleep 10;
      sh mqadmin updateTopic -n namesrv:9876 -c DefaultCluster -t practice-order-topic -r 8 -w 8;
      sh mqadmin updateSubGroup -n namesrv:9876 -c DefaultCluster -g practice-order-business-group;
      sh mqadmin updateSubGroup -n namesrv:9876 -c DefaultCluster -g practice-order-audit-group"
    restart: "no"
    networks:
      - rocketmq

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    depends_on:
      - namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=namesrv:9876"
    ports:
      - "8082:8082"
    networks:
      - rocketmq

networks:
  rocketmq:
    driver: bridge
